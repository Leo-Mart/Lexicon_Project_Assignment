name: CI

on:
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Backend
  # ------------------------------------------------------------

  backend:
    name: Backend build and formatting
    runs-on: ubuntu-latest

    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LMS.slnx

      - name: Check .NET formatting
        run: >
          dotnet format LMS.slnx
          --verify-no-changes
          --no-restore
          --verbosity diagnostic

      - name: Build solution
        run: >
          dotnet build LMS.slnx
          --configuration Release
          --no-restore
          --warnaserror


  # ------------------------------------------------------------
  # Unit tests
  # ------------------------------------------------------------

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    needs: backend

    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LMS.slnx

      - name: Run unit tests
        run: >
          dotnet test
          ./tests/LMS.Api.Tests/LMS.Api.Tests.csproj
          --configuration Release
          --no-restore
          --verbosity normal


  # ------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------

  frontend:
    name: Frontend lint, format and build
    runs-on: ubuntu-latest

    if: github.event.pull_request.draft == false

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Build frontend
        run: npm run build


  # ------------------------------------------------------------
  # Secret scanning
  # ------------------------------------------------------------

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest

    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ------------------------------------------------------------
  # GitHub Actions workflow lint
  # ------------------------------------------------------------

  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest

    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
